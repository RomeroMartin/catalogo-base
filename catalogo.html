<!doctype html>
<html lang="es-AR" data-root="" data-page="catalogo" data-page-title="Catálogo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda</title>
  <!-- CLIENTE: título y descripción para buscadores (el título se completa solo con el nombre de la tienda) -->
  <meta name="description" content="Mirá todos los productos y armá tu pedido.">
  <meta name="theme-color" content="#FBF8F4">
  <!-- CLIENTE: datos para compartir en redes (cambiar dominio e imagen) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Casa Nube — objetos para tu casa">
  <meta property="og:description" content="Mirá todos los productos y armá tu pedido.">
  <meta property="og:image" content="https://catalogo-base.pages.dev/assets/og-image.png">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/catalogo.css">
  <!-- CLIENTE: datos estructurados (JSON-LD) para Google; cambiar nombre, url y teléfono -->
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Store", "name": "Casa Nube", "url": "https://catalogo-base.pages.dev/", "image": "https://catalogo-base.pages.dev/assets/og-image.png" }
  </script>
</head>
<body>
  <a class="sr-only" href="#contenido">Saltar al contenido</a>
  <div id="app-header"></div>
  <main id="contenido">
    <div class="container">
      <h1 style="margin-top:var(--space-6)">Catálogo</h1>
      <div class="toolbar">
        <div class="field"><label class="sr-only" for="buscar">Buscar productos</label><input class="input" id="buscar" type="search" placeholder="Buscar productos…" autocomplete="off"></div>
        <div class="field"><label class="sr-only" for="orden">Ordenar por</label>
          <select class="select" id="orden">
            <option value="destacados">Destacados</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
            <option value="nombre">Nombre</option>
          </select></div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
      <div class="grid" id="grilla" style="margin-top:var(--space-5)" aria-live="polite"></div>
    </div>
    <div class="modal" id="modal-producto" role="dialog" aria-label="Producto"></div>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="js/pages/catalogo.js"></script>
</body>
</html>
