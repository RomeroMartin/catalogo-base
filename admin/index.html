<!doctype html>
<html lang="es-AR" data-root="../" data-page="admin" data-page-title="Panel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda</title>
  <!-- CLIENTE: título y descripción para buscadores (el título se completa solo con el nombre de la tienda) -->
  <meta name="description" content="Panel de administración.">
  <meta name="robots" content="noindex, nofollow">
  <!-- CLIENTE: theme-color debe ser el mismo valor que --color-bg de css/theme.css -->
  <meta name="theme-color" content="#FBF8F4">
  <!-- CLIENTE: datos para compartir en redes (cambiar dominio e imagen) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Casa Nube — objetos para tu casa">
  <meta property="og:description" content="Panel de administración.">
  <meta property="og:image" content="https://catalogo-base.pages.dev/assets/og-image.png">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <!-- CLIENTE: si cambiás las tipografías en css/theme.css, cambiá también el enlace de Google Fonts de abajo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/cuenta.css">
  <!-- CLIENTE: datos estructurados (JSON-LD) para Google; cambiar nombre, url y teléfono -->
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Store", "name": "Casa Nube", "url": "https://catalogo-base.pages.dev/", "image": "https://catalogo-base.pages.dev/assets/og-image.png" }
  </script>
</head>
<body>
  <a class="sr-only" href="#contenido">Saltar al contenido</a>
  <div id="app-header"></div>
  <main id="contenido">
    <div class="container" id="admin-root">
      <noscript><p class="empty">Necesitás activar JavaScript para usar el panel.</p></noscript>
    </div>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="../js/pages/admin/admin.js"></script>
</body>
</html>
