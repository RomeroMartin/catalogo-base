<!doctype html>
<html lang="es-AR" data-root="" data-page="cuenta" data-page-title="Mi cuenta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda</title>
  <!-- CLIENTE: título y descripción para buscadores (el título se completa solo con el nombre de la tienda) -->
  <meta name="description" content="Ingresá o registrate para ver tus pedidos.">
  <!-- CLIENTE: theme-color debe ser el mismo valor que --color-bg de css/theme.css -->
  <meta name="theme-color" content="#FBF8F4">
  <!-- CLIENTE: datos para compartir en redes (cambiar dominio e imagen) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Casa Nube — objetos para tu casa">
  <meta property="og:description" content="Ingresá o registrate para ver tus pedidos.">
  <meta property="og:image" content="https://catalogo-base.pages.dev/assets/og-image.png">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- CLIENTE: preconexión al proyecto de Supabase (mismo dominio que supabaseUrl en js/site.config.js) -->
  <link rel="preconnect" href="https://pnxplpmyeozclhhpjfsq.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Precarga del cliente de Supabase: si cambiás la versión en js/supabase-client.js, cambiala también acá -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm">
  <!-- Precarga de los módulos JS de esta página (se bajan en paralelo en vez de en cadena) -->
  <link rel="modulepreload" href="js/pages/cuenta.js">
  <link rel="modulepreload" href="js/lib/auth.js">
  <link rel="modulepreload" href="js/supabase-client.js">
  <link rel="modulepreload" href="js/site.config.js">
  <link rel="modulepreload" href="js/lib/cart.js">
  <link rel="modulepreload" href="js/lib/api.js">
  <link rel="modulepreload" href="js/lib/format.js">
  <link rel="modulepreload" href="js/lib/dom.js">
  <link rel="modulepreload" href="js/lib/store.js">
  <link rel="modulepreload" href="js/components/layout.js">
  <link rel="modulepreload" href="js/components/cart-ui.js">
  <link rel="modulepreload" href="js/components/producto-card.js">
  <link rel="modulepreload" href="js/lib/image-url.js">
  <!-- CLIENTE: precarga de las tipografías de css/theme.css (cambiar si cambian los archivos) -->
  <link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/cuenta.css">
  <!-- CLIENTE: datos estructurados (JSON-LD) para Google; cambiar nombre, url y teléfono -->
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Store", "name": "Casa Nube", "url": "https://catalogo-base.pages.dev/", "image": "https://catalogo-base.pages.dev/assets/og-image.png" }
  </script>
</head>
<body>
  <a class="sr-only" href="#contenido">Saltar al contenido</a>
  <div id="app-header"></div>
  <main id="contenido">
    <div class="container" id="cuenta-root">
      <noscript><p class="empty">Necesitás activar JavaScript para usar tu cuenta.</p></noscript>
    </div>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="js/pages/cuenta.js"></script>
</body>
</html>
